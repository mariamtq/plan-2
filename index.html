<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3-Year Integrated Compliance Assurance Plan — Tier 1 NZ Bank</title>

<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>
body {
  margin:0;
  font-family:'IBM Plex Sans',sans-serif;
  background:#0a0c10;
  color:#e8edf5;
}
.header{
  padding:30px;
  background:#111418;
  border-bottom:3px solid #f5c842;
}
.header h1{
  margin:0;
  font-family:'Syne',sans-serif;
  font-size:28px;
}
.main{padding:30px;}

.regime{
  background:#181c23;
  border:1px solid #2e3547;
  border-radius:10px;
  margin-bottom:20px;
}

.regime-title{
  padding:14px 18px;
  background:#1f2430;
  font-weight:700;
  font-family:'Syne',sans-serif;
}

.grid{
  display:grid;
  grid-template-columns:160px repeat(12,1fr);
  font-size:12px;
}

.cell{
  border-right:1px solid #2e3547;
  border-bottom:1px solid #2e3547;
  padding:6px;
}

.header-cell{
  background:#252b38;
  text-align:center;
  font-weight:600;
}

.lod{
  font-weight:700;
}
.l1{color:#f5c842;}
.l2{color:#00d4aa;}
.l3{color:#a78bfa;}

.pill{
  font-size:10px;
  padding:2px 5px;
  margin-bottom:3px;
  border-left:3px solid;
}

.ct{border-color:#38b2f5}
.att{border-color:#84cc16}
.tr{border-color:#f97316}
.mon{border-color:#a78bfa}
.cr{border-color:#22d3ee}
.aud{border-color:#ff4d6d}
.reg{border-color:#f5c842}
</style>
</head>

<body>

<div class="header">
<h1>Integrated Compliance Assurance Plan</h1>
<p>FY2026–FY2028 · Tier 1 Legislation · All Lines of Defence</p>
</div>

<div class="main" id="plan"></div>

<script>
const quarters = ["Q1","Q2","Q3","Q4","Q1","Q2","Q3","Q4","Q1","Q2","Q3","Q4"];

const regimes = [
"AML/CFT Act 2009",
"CCCFA 2003",
"FMCA (CoFI)",
"FMCA Part 7 – Climate Related Disclosures",
"Deposit Takers Act",
"Insurance (Prudential Supervision) Act",
"Health & Safety at Work Act 2015",
"Contracts of Insurance Act 2024"
];

function buildRow(label, cls, activities){
  let html = `<div class="cell lod ${cls}">${label}</div>`;
  for(let i=0;i<12;i++){
    html += `<div class="cell">`;
    activities.forEach(a => {
      html += `<div class="pill ${a}">${a.toUpperCase()}</div>`;
    });
    html += `</div>`;
  }
  return html;
}

const container = document.getElementById("plan");

regimes.forEach(r => {
  container.innerHTML += `
    <div class="regime">
      <div class="regime-title">${r}</div>
      <div class="grid">
        <div class="cell header-cell"></div>
        ${quarters.map(q => `<div class="cell header-cell">${q}</div>`).join("")}

        ${buildRow("Line 1 – Business","l1",["mon","att","ct"])}
        ${buildRow("Line 2 – Compliance","l2",["tr","cr","ct","reg"])}
        ${buildRow("Line 3 – Audit","l3",["aud"])}

      </div>
    </div>
  `;
});
</script>

</body>
</html>
