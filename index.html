<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Compliance Assurance Plan</title>

<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>
:root {
  --bg:#0a0c10; --text:#e8edf5; --card:#181c23; --border:#2e3547;
  --gold:#f5c842; --teal:#00d4aa; --rose:#ff4d6d;
}
.light {
  --bg:#ffffff; --text:#111; --card:#f4f6f9; --border:#ddd;
}
body {
  margin:0; font-family:'IBM Plex Sans', sans-serif;
  background:var(--bg); color:var(--text);
}
.header {
  padding:20px; display:flex; justify-content:space-between; align-items:center;
  border-bottom:1px solid var(--border);
}
h1 { margin:0; font-family:'Syne'; color:var(--gold); }
.controls { display:flex; gap:10px; }
button, input {
  padding:8px 12px;
  border-radius:6px;
  border:1px solid var(--border);
  background:var(--card);
  color:var(--text);
  cursor:pointer;
}
.container { padding:20px; }
.regime {
  background:var(--card);
  border:1px solid var(--border);
  padding:16px;
  border-radius:8px;
  margin-bottom:12px;
}
.regime h3 { margin:0 0 6px; }
.hidden { display:none; }
</style>
</head>

<body>

<div class="header">
  <h1>Compliance Plan</h1>
  <div class="controls">
    <input id="search" placeholder="Search regimes..." />
    <button id="themeToggle">Toggle Theme</button>
    <button id="exportCSV">Export CSV</button>
    <button onclick="window.print()">Export PDF</button>
  </div>
</div>

<div class="container" id="app"></div>

<script>
// ---------------- DATA ----------------
const regimes = [
  {id:'aml', tier:'Tier 1', name:'AML / CFT', desc:'Anti-money laundering controls'},
  {id:'cofi', tier:'Tier 1', name:'CoFI', desc:'Conduct regulation'},
  {id:'cccfa', tier:'Tier 1', name:'CCCFA', desc:'Consumer lending'},
  {id:'privacy', tier:'Tier 2', name:'Privacy Act', desc:'Data protection'},
  {id:'cyber', tier:'Tier 2', name:'Cyber Risk', desc:'Operational resilience'}
];

// ---------------- RENDER ----------------
const app = document.getElementById('app');

function render(list){
  app.innerHTML = '';
  list.forEach(r=>{
    const d = document.createElement('div');
    d.className='regime';
    d.id = r.id;
    d.innerHTML = `
      <h3>${r.name} <small>(${r.tier})</small></h3>
      <p>${r.desc}</p>
      <button data-id="${r.id}" class="open">Open</button>
    `;
    app.appendChild(d);
  });

  // attach events
  document.querySelectorAll('.open').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      location.hash = btn.dataset.id;
      alert("Deep link set → #" + btn.dataset.id);
    });
  });
}

render(regimes);

// ---------------- SEARCH ----------------
document.getElementById('search').addEventListener('input', e=>{
  const q = e.target.value.toLowerCase();
  render(regimes.filter(r =>
    r.name.toLowerCase().includes(q) ||
    r.desc.toLowerCase().includes(q)
  ));
});

// ---------------- THEME TOGGLE ----------------
document.getElementById('themeToggle').addEventListener('click', ()=>{
  document.body.classList.toggle('light');
});

// ---------------- CSV EXPORT ----------------
document.getElementById('exportCSV').addEventListener('click', ()=>{
  let csv = "ID,Tier,Name,Description\n";
  regimes.forEach(r=>{
    csv += `${r.id},${r.tier},${r.name},${r.desc}\n`;
  });

  const blob = new Blob([csv], {type:'text/csv'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = "compliance-plan.csv";
  a.click();
});

// ---------------- DEEP LINK ----------------
if (location.hash) {
  const id = location.hash.replace('#','');
  setTimeout(()=>{
    const el = document.getElementById(id);
    if (el) {
      el.scrollIntoView({behavior:'smooth'});
      el.style.outline = '2px solid var(--gold)';
    }
  }, 300);
}
</script>

</body>
</html>
